name: dayplan-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dayplan
      POSTGRES_PASSWORD: dayplan
      POSTGRES_DB: dayplan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayplan -d dayplan"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
